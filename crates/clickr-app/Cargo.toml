[package]
name = "clickr-app"
description = "The Clickr Mac app: receives presses from the Clickr iPhone app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clickr-app"
path = "src/main.rs"

[dependencies]
clickr-core.workspace = true
clickr-host.workspace = true
dioxus = { version = "0.7.10", features = ["desktop"] }
n0-error.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
