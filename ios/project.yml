# Generates Clickr.xcodeproj. Run `xcodegen generate` in this directory, or
# scripts/build-ios.sh which also builds the Rust library first.
#
# Set DEVELOPMENT_TEAM in your environment to sign for a device, for example
# `DEVELOPMENT_TEAM=ABCDE12345 xcodegen generate`.
name: Clickr
options:
  bundleIdPrefix: computer.n0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ClickrKit:
    path: ClickrKit
targets:
  Clickr:
    type: application
    platform: iOS
    sources:
      - Clickr
    dependencies:
      - package: ClickrKit
    info:
      path: Clickr/Info.plist
      properties:
        CFBundleDisplayName: Clickr
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Clickr uses Bluetooth to reach your computer when the two aren't on the same network.
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Clickr uses the camera to scan the pairing code printed by `clickr accept`.
        NSLocalNetworkUsageDescription: Clickr connects directly to your computer when both are on the same network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.n0.clickr
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The Rust library is only built for arm64 simulators (Apple silicon).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
