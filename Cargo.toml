[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/clickr", "crates/clickr-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
clickr-core = { path = "crates/clickr-core" }
iroh = { version = "1.4.1", features = ["unstable-custom-transports"] }
iroh-ble-transport = "0.6"
iroh-tickets = "1"
n0-error = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
